<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What's the Tea ☀️ Weather Check</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #ff006e 0%, #fb5607 25%, #ffbe0b 50%, #8338ec 75%, #3a86ff 100%);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        min-height: 100vh;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .app {
        background: rgba(255, 255, 255, 0.95);
        padding: 40px;
        border-radius: 30px;
        width: 380px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(10px);
        border: 2px solid rgba(255, 255, 255, 0.5);
    }

    h2 {
        font-family: 'Fredoka One', sans-serif;
        font-size: 32px;
        margin-bottom: 10px;
        background: linear-gradient(135deg, #ff006e, #3a86ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
    }

    .subtitle {
        font-size: 12px;
        color: #888;
        margin-bottom: 25px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .input-group {
        display: flex;
        gap: 10px;
        margin-bottom: 25px;
    }

    input {
        padding: 14px 18px;
        flex: 1;
        border-radius: 20px;
        border: 2px solid #ff006e;
        outline: none;
        font-family: 'Poppins', sans-serif;
        font-size: 14px;
        transition: all 0.3s ease;
        background: rgba(255, 0, 110, 0.05);
    }

    input:focus {
        border-color: #3a86ff;
        box-shadow: 0 0 15px rgba(58, 134, 255, 0.3);
        background: rgba(58, 134, 255, 0.05);
    }

    input::placeholder {
        color: #aaa;
    }

    button {
        padding: 14px 28px;
        border: none;
        background: linear-gradient(135deg, #ff006e, #fb5607);
        color: white;
        border-radius: 20px;
        cursor: pointer;
        font-family: 'Poppins', sans-serif;
        font-weight: 700;
        font-size: 14px;
        transition: all 0.3s ease;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(255, 0, 110, 0.4);
    }

    button:active {
        transform: translateY(-1px);
    }

    .weather {
        margin-top: 30px;
    }

    .weather-placeholder {
        color: #888;
        font-size: 14px;
        font-style: italic;
    }

    .city-name {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 15px;
        color: #222;
    }

    .temp {
        font-size: 72px;
        font-weight: 800;
        background: linear-gradient(135deg, #ff006e, #3a86ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 20px 0;
    }

    .desc {
        text-transform: capitalize;
        margin-bottom: 20px;
        font-size: 18px;
        color: #555;
        font-weight: 500;
    }

    .weather-details {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 20px;
    }

    .detail-card {
        background: linear-gradient(135deg, rgba(255, 0, 110, 0.1), rgba(58, 134, 255, 0.1));
        padding: 15px;
        border-radius: 15px;
        border: 1px solid rgba(255, 0, 110, 0.2);
    }

    .detail-label {
        font-size: 12px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 5px;
    }

    .detail-value {
        font-size: 24px;
        font-weight: 700;
        color: #222;
    }

    .error {
        color: #ff006e;
        font-weight: 600;
    }

    .chart-container {
        margin-top: 30px;
        padding: 20px;
        background: rgba(255, 0, 110, 0.05);
        border-radius: 20px;
        border: 1px solid rgba(255, 0, 110, 0.2);
    }

    .chart-title {
        font-size: 14px;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        margin-bottom: 15px;
    }

    canvas {
        max-height: 250px !important;
    }

    .app {
        max-width: 500px;
        width: 90%;
    }
</style>
</head>

<body>

<div class="app">
    <h2>☀️ What's the Tea?</h2>
    <div class="subtitle">no cap weather check fr fr</div>
    
    <div class="input-group">
        <input type="text" id="city" placeholder="search ur city bestie 🔍">
        <button onclick="getWeather()">go</button>
    </div>

    <div class="weather" id="weather">
        <p class="weather-placeholder">enter a city to spill the tea ☕</p>
    </div>

    <div class="chart-container" id="chartContainer" style="display:none;">
        <div class="chart-title">📈 hourly temp vibes</div>
        <canvas id="weatherChart"></canvas>
    </div>
</div>

<script>
    const apiKey = "YOUR_API_KEY_HERE";
    let weatherChart = null;

    const weatherEmojis = {
        'clear': '☀️',
        'clouds': '☁️',
        'rain': '🌧️',
        'drizzle': '🌦️',
        'thunderstorm': '⛈️',
        'snow': '❄️',
        'mist': '🌫️',
        'smoke': '💨',
        'haze': '🌫️',
        'dust': '🌪️',
        'fog': '🌫️',
        'sand': '🌪️',
        'ash': '🌋',
        'squall': '💨',
        'tornado': '🌪️'
    };

    function getWeatherEmoji(description) {
        const desc = description.toLowerCase();
        for (let key in weatherEmojis) {
            if (desc.includes(key)) {
                return weatherEmojis[key];
            }
        }
        return '🌤️';
    }

    function createWeatherChart(forecastData) {
        const ctx = document.getElementById('weatherChart').getContext('2d');
        
        // Group data by hour
        const hourlyData = {};
        
        forecastData.list.forEach(item => {
            const date = new Date(item.dt * 1000);
            const hour = date.getHours() + ':00';
            if (!hourlyData[hour]) {
                hourlyData[hour] = [];
            }
            hourlyData[hour].push(item.main.temp);
        });

        const labels = Object.keys(hourlyData).slice(0, 24);
        const temps = labels.map(hour => {
            const avgTemp = hourlyData[hour].reduce((a, b) => a + b, 0) / hourlyData[hour].length;
            return Math.round(avgTemp);
        });

        // Destroy old chart if it exists
        if (weatherChart) {
            weatherChart.destroy();
        }

        weatherChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Temperature (°C)',
                    data: temps,
                    borderColor: '#ff006e',
                    backgroundColor: 'rgba(255, 0, 110, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointBackgroundColor: '#ff006e',
                    pointBorderColor: '#fff',
                    pointBorderWidth: 2,
                    pointRadius: 5,
                    pointHoverRadius: 7,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    filler: {
                        propagate: true
                    }
                },
                scales: {
                    y: {
                        beginAtZero: false,
                        grid: {
                            color: 'rgba(255, 0, 110, 0.1)',
                            drawBorder: false
                        },
                        ticks: {
                            color: '#888',
                            font: {
                                family: "'Poppins', sans-serif",
                                size: 12
                            }
                        }
                    },
                    x: {
                        grid: {
                            display: false
                        },
                        ticks: {
                            color: '#888',
                            font: {
                                family: "'Poppins', sans-serif",
                                size: 12
                            }
                        }
                    }
                }
            }
        });
    }

    async function getWeather() {
        const city = document.getElementById("city").value;
        const weatherDiv = document.getElementById("weather");
        const chartContainer = document.getElementById("chartContainer");

        if (!city) {
            weatherDiv.innerHTML = "<p class='error'>yo bestie, enter a city first 😭</p>";
            chartContainer.style.display = 'none';
            return;
        }

        try {
            // Fetch current weather
            const response = await fetch(
                `https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=${apiKey}`
            );

            if (!response.ok) {
                throw new Error("that city's giving ghost vibes 👻 not found");
            }

            const data = await response.json();
            const temp = data.main.temp;
            const desc = data.weather[0].description;
            const humidity = data.main.humidity;
            const wind = data.wind.speed;
            const emoji = getWeatherEmoji(desc);

            weatherDiv.innerHTML = `
                <div class="city-name">${data.name} ${emoji}</div>
                <div class="temp">${Math.round(temp)}°</div>
                <div class="desc">${desc} no cap</div>
                <div class="weather-details">
                    <div class="detail-card">
                        <div class="detail-label">humidity</div>
                        <div class="detail-value">${humidity}%</div>
                    </div>
                    <div class="detail-card">
                        <div class="detail-label">wind vibes</div>
                        <div class="detail-value">${Math.round(wind)} m/s</div>
                    </div>
                </div>
            `;

            // Fetch forecast data for the chart
            const forecastResponse = await fetch(
                `https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${apiKey}`
            );

            if (forecastResponse.ok) {
                const forecastData = await forecastResponse.json();
                createWeatherChart(forecastData);
                chartContainer.style.display = 'block';
            }

        } catch (error) {
            weatherDiv.innerHTML = `<p class='error'>${error.message}</p>`;
            chartContainer.style.display = 'none';
        }
    }

    document.getElementById("city").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            getWeather();
        }
    });
</script>

</body>
</html>
